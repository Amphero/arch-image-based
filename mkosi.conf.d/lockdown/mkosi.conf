# Kernel lockdown as in GNOME OS (lockdown=integrity on its signed
# command line): with Secure Boot on, even root cannot change the
# running kernel any more. No unsigned modules (the Arch kernel signs
# all of its own, MODULE_SIG_ALL), no /dev/mem, /dev/port, iopl or MSR
# writes, no unsigned kexec, no hibernation. Nothing here hibernates:
# the swap file is recreated on every boot and no resume device is set
# up, the swap partition of older installations included.
#
# Not on coreboot machines: internal flashing with flashrom maps the SPI
# controller through /dev/mem and I/O ports, lockdown forbids both. A
# flash addon cannot lift it either, the kernel only ever raises the
# lockdown level. vbnv and vboot-boot-ok only use /dev/nvram, which
# lockdown does not restrict.
[Match]
Profiles=!coreboot

[Content]
KernelCommandLine=lockdown=integrity
