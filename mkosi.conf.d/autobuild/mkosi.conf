# Always on. Weekly self rebuild: the machine builds its own image from a frozen
# repo checkout in /var/lib/builder and installs it via sysupdate.
# Config updates stay manual (builder-update-config.sh snapshots first).
# One time setup per machine: builder-setup.sh, then copy mkosi.key/crt.

[Content]
Packages=
        git
        mkosi

[Runtime]
# the build workspace on root needs room in test VMs
RuntimeSize=80G
