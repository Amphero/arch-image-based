# Unlock entry for the builder partition. Generators read crypttab
# before tmpfiles runs, so this takes effect from the second boot on,
# which is fine: the builder is populated after the first boot anyway.
f+ /etc/crypttab 0600 root root - builder\x20/dev/disk/by-partlabel/ArchLinux-builder\x20none\x20tpm2-device=auto,nofail
