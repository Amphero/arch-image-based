# Workspace for the weekly self rebuild: repo checkout, package cache,
# build output, signing key. A subvolume on the encrypted root, so it
# shares the free space instead of reserving a fixed partition. A
# factory reset wipes it with the rest of root, run builder-setup.sh
# again afterwards.
v /var/lib/builder 0700 root root -
