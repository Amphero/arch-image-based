# tlp replaces power-profiles-daemon on every machine, tlp-pd serves the
# same D-Bus name so the power mode menu of GNOME and KDE keeps working.
# tlp's defaults need no config. Device profiles link their tuning in
# here (tmpfiles.d/tlp-<device>.conf), local changes go into a later
# drop-in such as /etc/tlp.d/50-local.conf.
d /etc/tlp.d 0755 root root -
