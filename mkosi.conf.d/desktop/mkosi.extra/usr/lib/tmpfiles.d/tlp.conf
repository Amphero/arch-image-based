# tlp replaces power-profiles-daemon on every machine, tlp-pd serves the
# same D-Bus name so the power mode menu of GNOME and KDE keeps working.
# tlp's defaults need no changes, but tlp refuses to start without
# /etc/tlp.conf ("cannot read user configuration", TLP_ENABLE unset), so
# link the stock file from the image like etc.conf does for the rest.
# Device profiles link their tuning in here
# (tmpfiles.d/tlp-<device>.conf), local changes go into a later drop-in
# such as /etc/tlp.d/50-local.conf.
L? /etc/tlp.conf
d /etc/tlp.d 0755 root root -
