[Content]
Packages=
        bluez
        bolt
        desktop-file-utils
        alsa-utils
        distrobox
        fprintd
        gst-plugin-pipewire
        gst-plugins-good
        hplip
        libde265
        pipewire-libcamera
        pipewire-v4l2
        podman
        system-config-printer
        systemd-resolvconf
        gst-libav
        gst-plugin-va
        gst-plugins-bad
        gst-plugins-ugly
        noto-fonts-cjk
        pipewire-jack
        pipewire
        pipewire-alsa
        wireless-regdb
        xdg-desktop-portal

# NetworkManager is used on the desktop
RemoveFiles=/usr/lib/systemd/network/89-ethernet.network

KernelCommandLine=plymouth.use-simpledrm splash

KernelInitrdModules=/drivers/gpu/drm

InitrdProfiles=plymouth
