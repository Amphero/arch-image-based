[Content]
Packages=
        bluez
        bolt
        desktop-file-utils
        alsa-utils
        distrobox
        fprintd
        gst-plugin-pipewire
        gst-plugins-good
        hplip
        libde265
        pipewire-libcamera
        pipewire-v4l2
        plymouth
        podman
        system-config-printer
        systemd-resolvconf
        gst-libav
        gst-plugin-va
        gst-plugins-bad
        gst-plugins-ugly
        noto-fonts-cjk
        pipewire-jack
        pipewire
        pipewire-alsa
        wireless-regdb
        xdg-desktop-portal

# NetworkManager is used on the desktop
RemoveFiles=/usr/lib/systemd/network/89-ethernet.network

# Boot without any text, the splash covers the rest. Errors still land
# in the journal. For a verbose boot use a temporary addon, see
# addons/debug.cmdline.
# plymouth has to be in the image as well, not only in the initrd
# (InitrdProfiles=plymouth below): without it the splash ends at the
# switch to the real root and the text console shows until the login
# screen, fsck of the ESP included. The display manager quits it.
KernelCommandLine=
        plymouth.use-simpledrm
        splash
        quiet
        loglevel=1
        systemd.show_status=false
        rd.udev.log_level=1

KernelInitrdModules=/drivers/gpu/drm

InitrdProfiles=plymouth
