# fwupd's Locked-MTD checks ask the flash chip for its block-protection
# bits (MEMISLOCKED), which this firmware cannot set: the SMM capsule
# writer would be locked out along with everything else. The protection
# is PCH protected ranges plus SMM BWP, so better no MTD device at
# all. Internal flashrom talks PCI directly and never used it.
blacklist spi_intel_pci
blacklist spi_intel
