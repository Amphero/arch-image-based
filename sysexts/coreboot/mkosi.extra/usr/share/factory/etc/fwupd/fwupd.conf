# Reached through the /etc/fwupd factory symlink. Local cabs carry no
# LVFS signature - capsule authenticity is the firmware's PKCS#7 check,
# not fwupd's. No shim with your own Secure Boot keys, and the T480 runs
# on two batteries whose combined level trips the power check.

[fwupd]
OnlyTrusted=false
IgnorePower=true

[uefi_capsule]
DisableShimForSecureBoot=true
