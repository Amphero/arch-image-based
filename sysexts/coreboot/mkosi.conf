# Device side of the custom coreboot/vboot firmware
# (github.com/Amphero/custom-coreboot-t480): flashrom for internal
# updates, cbmem for the eventlog, vbnv plus the boot-ok unit so the
# A/B slot logic and the TPM rollback counter work without the ChromeOS
# updater. cbmem is not packaged, build it from the coreboot tree
# (make -C util/cbmem) and drop the package into mkosi.packages/.
# Internal flashing additionally needs iomem=relaxed on the kernel
# cmdline, which an extension cannot set - see addons/.

[Distribution]
Distribution=arch

[Output]
Format=sysext
Overlay=yes

[Content]
Packages=
        flashrom
