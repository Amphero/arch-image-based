# Tailscale client plus the NetworkManager VPN plugin. The daemon is
# enabled statically via the extra tree, device registration happens in
# the GNOME network settings. Drop the built plugin package into
# mkosi.packages/ first (make pkg in the plugin repo). The plasma half
# of the plugin goes into a kde specific sysext, it is version coupled
# to plasma-nm.

[Distribution]
Distribution=arch

[Output]
Format=sysext
Overlay=yes

[Content]
Packages=
        tailscale
        networkmanager-tailscale
