# The package's /etc/default/tailscaled never makes it into the image,
# a sysext only ships /usr. Make the file optional and provide the two
# variables it would set.
[Service]
Environment=PORT=41641 FLAGS=
EnvironmentFile=
EnvironmentFile=-/etc/default/tailscaled
