# Power management for the ThinkPad T480. tlp replaces
# power-profiles-daemon, which the extra tree masks, along with
# systemd-rfkill as recommended by the tlp docs.

[Distribution]
Distribution=arch

[Output]
Format=sysext
Overlay=yes

[Content]
Packages=
        tlp
        tlp-rdw
