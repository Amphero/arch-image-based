# Power management for the ThinkPad T480. tlp replaces
# power-profiles-daemon, which the extra tree masks, along with
# systemd-rfkill as recommended by the tlp docs. tlp-pd takes over the
# PowerProfiles bus name so the GNOME menu still switches something.
# ethtool is needed for WOL_DISABLE, tlp fails it silently without.

[Distribution]
Distribution=arch

[Output]
Format=sysext
Overlay=yes

[Content]
Packages=
        ethtool
        tlp
        tlp-pd
        tlp-rdw
