# tlp only reads drop-ins from /etc/tlp.d, which an extension cannot
# ship, so tmpfiles.d/tlp.conf symlinks that directory here.

# Switch by hand, never by power source: GNOME's power mode menu via
# tlp-pd, or tlp performance | balanced | power-saver.
TLP_AUTO_SWITCH=0
TLP_PROFILE_DEFAULT=BAL

# Since 1.9 the profile picks the suffix, not the power source:
# performance -> _ON_AC, balanced -> _ON_BAT, power-saver -> _ON_SAV.
# Spell out all three everywhere. tlp leaves a parameter the target
# profile does not set at its old value, so one trip to power-saver
# would pin its limits for good.

# intel_pstate active only has powersave and performance. Keep
# powersave, the performance governor pins the top P-state while idle;
# EPP below does the actual throttling. "default" EPP would write the
# firmware preference, balance_performance, even in a saving profile.
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# coreboot caps the board at PL1 15 W, PL2 18.75 W. At those limits
# racing to idle beats throttling, so turbo only goes in power-saver.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=100
CPU_MAX_PERF_ON_SAV=60

# Off everywhere: on the QCNFA765 it costs 8 ms and triples the jitter
# for 0.3-1 W. WIFI_PWR has no _ON_SAV, power-saver shares this value.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# Lazy in performance, short values pop on wake.
SOUND_POWER_SAVE_ON_AC=10
SOUND_POWER_SAVE_ON_BAT=1

START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80

DEVICES_TO_DISABLE_ON_STARTUP="nfc wwan"

# Deliberately unset, none of it does anything here: PCIE_ASPM (the
# kernel refuses the Thunderbolt port either way), PLATFORM_PROFILE (no
# DYTC under coreboot), INTEL_GPU_POWER_PROFILE (xe only, this is
# i915), SATA_LINKPWR, AHCI_RUNTIME_PM and DISK_APM_LEVEL (nvme only).
# NMI_WATCHDOG and MEM_SLEEP are on the kernel command line.
