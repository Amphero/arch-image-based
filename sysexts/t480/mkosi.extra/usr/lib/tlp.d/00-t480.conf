# tlp only reads drop-ins from /etc/tlp.d, which an extension cannot
# ship, so tmpfiles.d/tlp.conf symlinks that directory here.

TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=BAL

CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil
CPU_SCALING_GOVERNOR_ON_SAV=schedutil
CPU_ENERGY_PERF_POLICY_ON_AC=default
CPU_ENERGY_PERF_POLICY_ON_BAT=default
CPU_ENERGY_PERF_POLICY_ON_SAV=default

PLATFORM_PROFILE_ON_AC=low-power

WIFI_PWR_ON_BAT=off

SOUND_POWER_SAVE_ON_AC=10
SOUND_POWER_SAVE_ON_BAT=10

DEVICES_TO_DISABLE_ON_STARTUP="nfc wwan"

START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
