# DisplayLink USB graphics: evdi kernel module compiled against the
# base image kernel plus the proprietary DisplayLink manager, mirroring
# the AUR displaylink package. The service is started by the udev rule
# when a dock is plugged in, nothing to enable.
#
# Does not build yet. An extension needs Overlay=yes, and with a base
# tree overlay mkosi cannot stack its build overlay on top ("we don't
# support multiple levels of root overlay"), so BuildPackages= never
# reach the build script. Regular Packages= land in $BUILDROOT while
# the script sees the base image at /, and mkosi-chroot does not work
# in this setup either, so the compiler cannot be reached at all.
# The way out is to build the module outside of mkosi, in a container
# against the same kernel version, and drop the resulting package into
# mkosi.packages/, the same way the tailscale extension takes the
# networkmanager plugin.

[Distribution]
Distribution=arch

[Output]
Format=sysext
Overlay=yes

[Build]
WithNetwork=yes

[Content]
# The toolchain has to be regular packages: BuildPackages would go into
# mkosi's build overlay, and that cannot stack on the base tree overlay
# an extension needs, so the build script would not see them. Removing
# them again after the scripts have run keeps them out of the extension.
Packages=
        gcc
        linux-headers
        make
        unzip

RemovePackages=
        gcc
        linux-headers
        make
        unzip

RemoveFiles=
        /usr/src
        /usr/share/gcc
