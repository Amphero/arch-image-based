# DisplayLink USB graphics: evdi kernel module compiled against the
# base image kernel plus the proprietary DisplayLink manager, mirroring
# the AUR displaylink package. The build fails loudly when the repo
# linux-headers and the base image kernel disagree, so build it in the
# same run that built the image (builder flow). The service is started
# by the udev rule when a dock is plugged in, nothing to enable.

[Distribution]
Distribution=arch

[Output]
Format=sysext
Overlay=yes

[Build]
WithNetwork=yes

[Content]
BuildPackages=
        curl
        gcc
        libdrm
        linux-headers
        make
        unzip
