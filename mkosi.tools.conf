# Extra configuration for the default tools tree.

[Distribution]
# Same as in mkosi.conf: fetch the current archlinux-keyring, otherwise
# the tools tree build fails with "required key missing from keyring" as
# soon as the keyring of the running image is older than the packages.
RepositoryKeyFetch=yes
