[Config]
# 27 signs the initrd PCR policy that NvPCRs need since systemd 262
MinimumVersion=27

[Build]
# erofs like GNOME OS: tails of small files are packed into shared
# fragments and duplicate content is stored once, a smaller usr image.
# mkosi passes this to systemd-repart; no spaces, the setting splits
# on them.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-Efragments,fragdedupe=inode
ToolsTree=default
ToolsTreeProfiles=misc,runtime,gui
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions
Format=disk
ImageId=ArchLinux
ManifestFormat=json
Output=%i_%v_%a

[Content]
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        # Pin the usr partitions to this image's own version. With a
        # glob both slots match after the first A/B update and only one
        # of them is picked, so the other image can never mount its usr
        # and reboots in a loop. Set the version through mkosi.version
        # or -B, mkosi expands the specifiers when it parses this file.
        # The uki profiles below keep the glob, mkosi does not expand
        # specifiers in mkosi.uki-profiles/, so emergency and debug
        # always end up on the newest slot.
        systemd.image_filter=usr=%i_%v:usr-verity=%i_%v_verity:usr-verity-sig=%i_%v_verity_sig:root=ArchLinux-*:swap=ArchLinux-*:home=ArchLinux-*
        ipe.enforce=0
        rootflags=noatime
        # DMA protection on every machine. The Arch kernel builds
        # INTEL_IOMMU without DEFAULT_ON, AMD ignores the option.
        intel_iommu=on
        quiet
        loglevel=3
        systemd.show_status=auto
        rd.udev.log_level=3
        # zswap as GNOME OS configures it in its kernel: zstd, and the
        # shrinker writes cold compressed pages to the swap file early
        # instead of only once the pool is full.
        zswap.enabled=1
        zswap.compressor=zstd
        zswap.shrinker_enabled=1
        vt.global_cursor_default=0
InitrdProfiles=
KernelInitrdModules=default
Hostname=arch-????-????

Packages=
        acl
        attr
        bash-completion
        btrfs-progs
        ca-certificates
        coreutils
        cpio
        curl
        dbus-broker
        diffutils
        dmidecode
        dosfstools
        e2fsprogs
        efibootmgr
        erofs-utils
        exfatprogs
        file
        findutils
        fish
        fwupd
        gdisk
        grep
        gzip
        jq
        kbd
        kmod
        less
        man
        mtools
        nano
        nftables
        nvme-cli
        opensc
        openssl
        patch
        p11-kit
        pciutils
        pkcs11-provider
        sed
        systemd
        tar
        tree
        udev
        unzip
        usbutils
        util-linux
        which
        wireguard-tools
        xxd
        yubikey-manager
        zip
        zstd

VolatilePackages=
        systemd
        udev

InitrdVolatilePackages=
        systemd
        udev

[Validation]
SecureBoot=yes
SignExpectedPcr=yes

[Runtime]
RuntimeSize=30G
RAM=4G
CPUs=4
Ephemeral=yes
Credentials=
        passwd.plaintext-password.root=arch

[Distribution]
Distribution=arch
