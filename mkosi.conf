[Config]
# 27 signs the initrd PCR policy that NvPCRs need since systemd 262
MinimumVersion=27

[Build]
# erofs like GNOME OS: tails of small files are packed into shared
# fragments and duplicate content is stored once, a smaller usr image.
# mkosi passes this to systemd-repart; no spaces, the setting splits
# on them.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-Efragments,fragdedupe=inode
ToolsTree=default
ToolsTreeProfiles=misc,runtime,gui
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions
Format=disk
ImageId=ArchLinux
ManifestFormat=json
Output=%i_%v_%a
# The image's own hooks live in mkosi.scripts/, mkosi only finds them at
# the top level by name. mkosi.bump stays there, mkosi has no setting
# for it.
CleanScripts=mkosi.scripts/clean

[Content]
PostInstallationScripts=mkosi.scripts/postinst.chroot
FinalizeScripts=mkosi.scripts/finalize
PostOutputScripts=mkosi.scripts/postoutput
# Also goes into the default initrd (the setting is inherited there),
# where systemd-vconsole-setup loads it before plymouth takes the
# console. Without it the initrd only has systemd's fallback
# vconsole.conf, the kernel keeps the US keymap, and every LUKS
# password prompt of the boot, in the initrd and in the host, reads US
# keys. The host copy in /etc cannot fix that: by the time it is read,
# plymouth holds the console and vconsole-setup gives up ("All
# allocated virtual consoles are busy"). Keep in sync with
# mkosi.extra/usr/share/factory/etc/vconsole.conf.
Keymap=de-latin1-nodeadkeys
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        # Pin the usr partitions to this image's own version. With a
        # glob both slots match after the first A/B update and only one
        # of them is picked, so the other image can never mount its usr
        # and reboots in a loop. Set the version through mkosi.version
        # or -B, mkosi expands the specifiers when it parses this file.
        # The live and installer entries of the stick keep the glob,
        # mkosi does not expand specifiers in uki profiles. The stick
        # only carries one image, so that is fine there.
        systemd.image_filter=usr=%i_%v:usr-verity=%i_%v_verity:usr-verity-sig=%i_%v_verity_sig:root=ArchLinux-*:swap=ArchLinux-*:home=ArchLinux-*
        ipe.enforce=0
        rootflags=noatime
        # DMA protection on every machine. The Arch kernel builds
        # INTEL_IOMMU without DEFAULT_ON, AMD ignores the option.
        intel_iommu=on
        # zswap as in GNOME OS. The Arch kernel already enables it with
        # zstd and the shrinker (ZSWAP_DEFAULT_ON,
        # ZSWAP_COMPRESSOR_DEFAULT, ZSWAP_SHRINKER_DEFAULT_ON), GNOME OS
        # only raises the pool limit from 20% to 35% of RAM on its
        # command line.
        zswap.max_pool_percent=35
        vt.global_cursor_default=0
InitrdProfiles=
KernelInitrdModules=default
Hostname=arch-????-????

Packages=
        acl
        attr
        bash-completion
        btrfs-progs
        ca-certificates
        coreutils
        cpio
        curl
        dbus-broker
        diffutils
        dmidecode
        dosfstools
        e2fsprogs
        efibootmgr
        erofs-utils
        exfatprogs
        file
        findutils
        fish
        fwupd
        gdisk
        grep
        gzip
        jq
        kbd
        kmod
        less
        man
        mtools
        nano
        nftables
        nvme-cli
        opensc
        openssl
        patch
        p11-kit
        pciutils
        pkcs11-provider
        sed
        systemd
        tar
        tree
        udev
        unzip
        usbutils
        util-linux
        which
        wireguard-tools
        xxd
        yubikey-manager
        zip
        zstd

VolatilePackages=
        systemd
        udev

InitrdVolatilePackages=
        systemd
        udev

[Validation]
SecureBoot=yes
SignExpectedPcr=yes

[Runtime]
RuntimeSize=30G
RAM=4G
CPUs=4
Ephemeral=yes
Credentials=
        passwd.plaintext-password.root=arch

[Distribution]
Distribution=arch
# Fetch the current archlinux-keyring before populating the keyring.
# Without it pacman only knows the keys of the archlinux-keyring in the
# running image; once a package is signed by a newer packager key the
# build fails with "required key missing from keyring". The tools tree
# does not inherit this, see mkosi.tools.conf.
RepositoryKeyFetch=yes
