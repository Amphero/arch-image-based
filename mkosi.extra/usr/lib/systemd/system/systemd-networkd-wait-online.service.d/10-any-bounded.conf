# One online uplink is enough, and a port without carrier must not
# stall boot for the default two minutes. That hang is why this
# service used to be masked outright.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
