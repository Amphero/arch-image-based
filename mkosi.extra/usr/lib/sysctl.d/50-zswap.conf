# zswap in front of the encrypted swap partition, values from GNOME OS.
# Swapping into zswap is cheaper than dropping page cache (kernel docs,
# vm.swappiness), and an earlier kswapd keeps swapping out smooth.
vm.swappiness = 133
vm.watermark_scale_factor = 200
vm.watermark_boost_factor = 0
