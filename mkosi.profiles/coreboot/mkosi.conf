# Machines running the custom coreboot/vboot firmware
# (github.com/Amphero/coreboot-t480): flashrom for internal updates,
# vbnv plus the boot-ok unit so the A/B slot logic and the TPM rollback
# counter work without the ChromeOS updater. cbmem is not packaged,
# build it from the coreboot tree (make -C util/cbmem), drop the package
# into mkosi.packages/ at the top of the repo and add it below. Internal
# flashing additionally needs iomem=relaxed, see addons/.

[Content]
Packages=
        flashrom
