# TUXEDO InfinityBook 14 v5. enable_guc=2 loads the HuC for media
# encoding. The touchpad is likely I2C-HID, then the psmouse option does
# nothing, check dmesg for synaptics.

[Content]
KernelCommandLine=
        psmouse.synaptics_intertouch=1
        acpi_osi=Linux
        i915.enable_guc=2
        mem_sleep_default=deep
