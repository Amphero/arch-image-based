# Requires desktop profile.

# Only the desktop core. Everything that is available as a flatpak
# (viewers, editors, maps, music, ...) is left out on purpose, install
# those from Flathub as needed.

[Content]
Packages=
        gnome-backgrounds
        gnome-color-manager
        gnome-control-center
        gnome-keyring
        gnome-menus
        gnome-session
        gnome-settings-daemon
        gnome-shell
        gnome-software
        gnome-terminal
        ibus
        nautilus
        tecla
        xdg-desktop-portal-gnome
        xdg-desktop-portal-gtk
        xdg-user-dirs-gtk
