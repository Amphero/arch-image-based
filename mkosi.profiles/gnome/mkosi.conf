# Requires desktop profile.

# Only the desktop core. Everything that is available as a flatpak
# (viewers, editors, maps, music, ...) is left out on purpose, install
# those from Flathub as needed.

[Content]
Packages=
        gnome-backgrounds
        gnome-color-manager
        gnome-disk-utility
        gnome-control-center
        gnome-keyring
        gnome-menus
        gnome-session
        gnome-settings-daemon
        gnome-shell
        gnome-software
        gnome-console
        ibus
        evolution-data-server
        gnome-remote-desktop
        gnome-user-docs
        gnome-user-share
        grilo-plugins
        gvfs
        gvfs-afc
        gvfs-dnssd
        gvfs-goa
        gvfs-gphoto2
        gvfs-mtp
        gvfs-nfs
        gvfs-onedrive
        gvfs-smb
        gvfs-wsdd
        malcontent
        orca
        rygel
        yelp
        nautilus
        tecla
        xdg-desktop-portal-gnome
        xdg-desktop-portal-gtk
        xdg-user-dirs-gtk
