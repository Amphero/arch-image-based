# Acer Aspire E5-576 on the Insyde firmware (V1.47), i7-7500U, Intel
# AC 3168 wifi, Realtek card reader and RTL8111 Ethernet, SATA SSD. The
# battery of the test machine is dead, it only runs on AC. tlp only
# reads /etc/tlp.d, tmpfiles.d/tlp-aspire-e5.conf links this file there.
# Local changes go into a later drop-in, e.g. /etc/tlp.d/50-local.conf.

# Switch by hand: the GNOME power mode menu via tlp-pd, or
# tlp performance | balanced | power-saver. Without this tlp follows the
# power source and sits in performance on AC for good.
TLP_AUTO_SWITCH=0
TLP_PROFILE_DEFAULT=BAL

# The suffix is the profile, not the power source: performance ->
# _ON_AC, balanced -> _ON_BAT, power-saver -> _ON_SAV. intel_pstate runs
# active with powersave and HWP, driver and governor need no setting.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_SAV=0
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=100
CPU_MAX_PERF_ON_SAV=60

# Deliberately unset: runtime PM and wifi power saving come from tlp's
# defaults. In balanced all 17 PCI devices are at auto and wifi power
# saving is on, in performance 15 of them stay on and wifi power saving
# is off. Idle on AC the CPU package (RAPL) drew 1.02 W in performance
# and 0.99 W in balanced, three alternating rounds of 60 s each. The
# whole machine could not be measured without a battery. No DYTC or
# platform_profile, no charge thresholds on this firmware. SATA link
# power is already med_power_with_dipm.
