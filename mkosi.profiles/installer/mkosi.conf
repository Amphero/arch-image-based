# Live system, installer and the rescue entries for the stick. The
# installed system carries none of them, so its boot menu shows exactly
# the three image versions and nothing else. Storage target mode and the
# TPM2 clear run with root=off, so they work from the stick as well.
# Emergency shell: boot "Live System" and unlock with the recovery key.

[Content]
UnifiedKernelImageProfiles=
        uki/10-live.conf
        uki/20-install.conf
        uki/80-storagetm.conf
        uki/91-tpm2-clear.conf
