# Gate unlocking on the software TPM device, otherwise cryptsetup races
# the swtpm, logs "No TPM2 hardware discovered" and falls back to the
# passphrase. Gating on the service is not enough, it reports ready
# before udev has registered the device.
[Unit]
Wants=systemd-tpm2-swtpm.service
After=systemd-tpm2-swtpm.service
Wants=dev-tpmrm0.device
After=dev-tpmrm0.device
