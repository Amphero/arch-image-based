# Unlocking must wait for the software TPM. Only order on the service,
# not on a device node: the swtpm is tpm0 in the initrd but usually
# tpm1 in the host, and a Wants= on the wrong device unit stalls every
# host unlock (swap, home) for 90s. The service itself waits for its
# device via udevadm settle, see the drop-in on it.
[Unit]
Wants=systemd-tpm2-swtpm.service
After=systemd-tpm2-swtpm.service
