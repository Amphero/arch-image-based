# A software TPM has all-zero PCRs, nothing ever measures into it (the
# boot loader ran before the swtpm existed). Enrolling against the
# signed PCR policy therefore produces a token that never matches and
# the root can't be unlocked. Enroll without any PCR binding instead,
# the security of this setup comes from the boot-secret-encrypted TPM
# state, not from PCRs.
[Service]
ExecStart=
ExecStart=systemd-repart --dry-run=no --tpm2-pcrs= --tpm2-public-key-pcrs=
