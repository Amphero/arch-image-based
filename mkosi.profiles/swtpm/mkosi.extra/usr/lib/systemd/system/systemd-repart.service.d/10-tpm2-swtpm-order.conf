# SPDX-License-Identifier: LGPL-2.1-or-later
# repart creates the root partition with Encrypt=tpm2 on first boot and
# is the first TPM user in the initrd, before any cryptsetup instance
# exists. Nothing else pulls the software TPM in at that point, so do
# both here: pull it and wait for it. The service itself waits for its
# device (see the ExecStartPost drop-in), so After= on the service is
# enough.
[Unit]
Wants=systemd-tpm2-swtpm.service
After=systemd-tpm2-swtpm.service tpm2.target
