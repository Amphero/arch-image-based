# The host swtpm keeps its state files on the ESP open the whole time,
# so the idle unmount of the ESP automount can never succeed and retries
# every two minutes, spamming the journal. With a software TPM the ESP
# is simply always busy, don't try.
[Automount]
TimeoutIdleSec=0
