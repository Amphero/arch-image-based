# The swtpm state lives on the ESP. In the initrd the ESP mount hangs
# off the late local-fs strand, which waits for the root device, which
# waits for repart, which waits for us: a cycle. This edge pulls the
# ESP mount into the early transaction instead, making it a straight
# line: ESP, swtpm, repart, root. Also gets shutdown ordering right
# (unmount the ESP only after the swtpm stopped).
[Unit]
RequiresMountsFor=/efi/loader/swtpm
