# The service notifies readiness before udev has registered the TPM
# device, so everything ordered After= it can still race the device.
# Hold the startup until the device is really there (bounded, and "-"
# so an exotic numbering can't fail the unit).
[Service]
ExecStartPost=-/usr/bin/udevadm wait --timeout=10 /dev/tpmrm0
