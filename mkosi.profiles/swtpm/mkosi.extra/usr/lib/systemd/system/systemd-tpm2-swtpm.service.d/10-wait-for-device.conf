# The service notifies readiness before udev has registered the TPM
# device, so everything ordered After= it can still race the device.
# Wait for the udev queue instead of a concrete device node: in the
# initrd the swtpm is tpm0, in the host it usually ends up as tpm1
# (the initrd instance's number stays taken), so a fixed path would
# be wrong in one of the two worlds. Bounded and "-" so a slow queue
# can't fail the unit.
[Service]
ExecStartPost=-/usr/bin/udevadm settle --timeout=10
