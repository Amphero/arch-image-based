# The service notifies readiness right after it has created the vTPM
# proxy device. The kernel registers the TPM behind it asynchronously,
# so a plain "udevadm settle" can return before the uevent is even
# queued, and with systemd.tpm2_wait=0 systemd-cryptsetup then silently
# finds no TPM and asks for the recovery key (seen on aspire for swap).
# Wait until a resource manager device exists and udev has processed
# it. No concrete name: in the initrd the swtpm is tpm0, in the host it
# usually ends up as tpm1 (the initrd instance's number stays taken).
# Bounded (10s each) and "-" so a missing device can't fail the unit.
[Service]
ExecStartPost=-/usr/bin/bash -c 'for i in {1..100}; do d=(/sys/class/tpmrm/tpmrm*); [[ -e $${d[0]} ]] && exec udevadm wait --settle --timeout=10 "$${d[@]}"; sleep 0.1; done; exit 1'

# The host instance resumes the volatile state the initrd instance wrote
# out on stop. Sessions that were open at that moment, typically the
# kernel's own HMAC sessions for tpm-rng (CONFIG_TCG_TPM2_HMAC), come
# back without an owner and stay loaded. The swtpm has 3 slots for
# loaded sessions and an unseal needs 2: with orphans in the way it
# fails with TPM_RC_SESSION_MEMORY ("out of memory for session
# contexts"), which systemd-cryptsetup only logs at debug level before
# it falls back to the recovery key prompt. Nothing in the host has
# used the TPM yet at this point, so every session is an orphan.
ExecStartPost=-/usr/bin/bash -c '[[ -e /etc/initrd-release ]] && exit 0; d=(/dev/tpmrm*); export TPM2TOOLS_TCTI=device:$${d[0]}; tpm2_flushcontext --loaded-session; tpm2_flushcontext --saved-session'
