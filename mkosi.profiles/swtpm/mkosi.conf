# Software TPM for machines without a hardware TPM.
#
# systemd's systemd-tpm2-swtpm (systemd >= 261) runs a swtpm whose state
# lives encrypted on the ESP, keyed by the boot secret that only the
# signed UKI can obtain in pre-boot. Good enough to enroll LUKS against.
# See systemd-tpm2-swtpm(8). Requires a pre-boot RNG (normal UEFI: yes,
# coreboot: RngDxe needed) and Secure Boot with your keys.
#
# EXPERIMENTAL: test in a VM first, and remember that "mkosi vm" attaches
# a virtual hardware TPM by default, which hides this whole code path.
#
# The unit ordering fixes in mkosi.extra/ work around two handoff issues:
# the swtpm runs once in the initrd (tpm0) and once in the host (tpm1),
# and the stock tpm2.target waits for dev-tpm0.device forever in the
# host, while systemd-cryptsetup races the swtpm in the initrd unless it
# is gated on the device unit.

[Content]
Packages=
        swtpm

InitrdPackages=
        swtpm

KernelInitrdModules=
        /drivers/char/tpm

KernelCommandLine=
        systemd.tpm2_software_fallback=1
        systemd.tpm2_wait=0
