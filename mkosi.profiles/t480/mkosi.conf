# ThinkPad T480 (coreboot or stock). retbleed=stuff trades the IBRS
# default for call depth stuffing, faster on this Kaby Lake R, IBRS is
# the more conservative choice.

[Content]
KernelCommandLine=
        psmouse.synaptics_intertouch=1
        retbleed=stuff
        mem_sleep_default=deep
