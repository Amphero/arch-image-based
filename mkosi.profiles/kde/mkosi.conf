# Requires desktop profile.

# Only the desktop core. Apps that are available as a flatpak
# (ark, spectacle, system monitor, ...) are left out on purpose,
# install those from Flathub as needed. Discover comes in for
# installing them graphically.

[Content]
Packages=
        plasma-login-manager
        bluedevil
        breeze-gtk
        discover
        kde-gtk-config
        kdeplasma-addons
        kgamma
        kinfocenter
        kscreen
        ksshaskpass
        kwallet-pam
        kwrited
        ocean-sound-theme
        plasma-desktop
        plasma-disks
        plasma-nm
        plasma-pa
        plasma-thunderbolt
        plasma-welcome
        plasma-workspace-wallpapers
        powerdevil
        xdg-desktop-portal-kde
        flatpak-kcm
        konsole
        dolphin
