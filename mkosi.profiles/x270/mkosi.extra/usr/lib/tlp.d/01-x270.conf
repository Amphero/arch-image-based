# ThinkPad X270 on the Lenovo firmware, i5-6300U, Intel 8260 wifi,
# Sierra EM7455 LTE modem, internal and external battery. tlp only reads
# /etc/tlp.d, tmpfiles.d/tlp-x270.conf links this file there. Local
# changes go into a later drop-in, e.g. /etc/tlp.d/50-local.conf.

# Switch by hand: Plasma's tray via tlp-pd, or
# tlp performance | balanced | power-saver.
TLP_AUTO_SWITCH=0
TLP_PROFILE_DEFAULT=BAL

# The suffix is the profile, not the power source: performance -> _ON_AC,
# balanced -> _ON_BAT, power-saver -> _ON_SAV. intel_pstate already runs
# active with powersave, driver and governor need no setting.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_SAV=0
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=100
CPU_MAX_PERF_ON_SAV=60

# ModemManager is off, drop wwan here to use LTE.
DEVICES_TO_DISABLE_ON_STARTUP="wwan"

# Deliberately unset: runtime PM and USB autosuspend come from tlp's
# defaults (all PCI devices at auto, the modem suspends, about 0.2 W).
# Charge thresholds stay in Plasma's battery settings, the EC keeps
# them and a tlp value would overwrite them on every boot. No DYTC, so
# no PLATFORM_PROFILE. SATA link power and wifi power saving are
# already on by default.
